<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="pi-common.css" />
  </head>
  <body>
    <h1>Conta GitHub</h1>
    <div class="field">
      <label for="githubUsername">Usuário</label>
      <input id="githubUsername" type="text" placeholder="detectado automaticamente" data-global-setting="githubUsername" />
    </div>
    <p class="hint">Deixe em branco para detectar automaticamente via <code>gh api user</code>.</p>

    <h1>Avançado</h1>
    <div class="field">
      <label for="ghBinaryPath">Caminho do gh</label>
      <input id="ghBinaryPath" type="text" placeholder="gh" data-global-setting="ghBinaryPath" />
    </div>
    <p class="hint">No Windows, se informar um caminho completo, inclua a extensão <code>.exe</code>.</p>
    <div class="field">
      <label for="refreshIntervalSeconds">Refresh (segundos)</label>
      <input
        id="refreshIntervalSeconds"
        type="number"
        min="30"
        step="10"
        placeholder="60"
        data-global-setting="refreshIntervalSeconds"
        data-type="number"
      />
    </div>
    <p class="hint">Essas configurações são globais e valem para todas as actions do plugin (mínimo 30s).</p>

    <script src="pi-common.js"></script>
  </body>
</html>
